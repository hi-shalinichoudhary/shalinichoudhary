<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-home-title og-home-desc">
  <title id="og-home-title">Shalini Choudhary | SEO, GEO and AEO Strategy Leader</title>
  <desc id="og-home-desc">SEO, GEO and AEO strategy leader. 9,800 SEO-page leads to 3,200 applications and an INR 416 crore application pipeline, before enrolment conversion, at INR 13 lakh average programme value at GUS. Zero ranking loss Drupal migration and 15-20% citation gain.</desc>
  <style>
    :root {
      --ivory: #F3F2EF;
      --charcoal: #181818;
      --stone: #B7B5AF;
      --terracotta: #A65F43;
      --terracotta-deep: #8F4F36;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="var(--ivory, #F3F2EF)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="var(--ivory, #F3F2EF)" stroke="var(--stone, #B7B5AF)" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="10" rx="5" fill="var(--terracotta, #A65F43)"/>

  <!-- Header -->
  <text x="72" y="92" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--terracotta-deep, #8F4F36)" font-size="15" font-weight="700" letter-spacing="2.2">SHALINI CHOUDHARY · SEO, GEO &amp; AEO STRATEGY LEADER</text>
  <rect x="910" y="66" width="218" height="38" rx="19" fill="var(--charcoal, #181818)"/>
  <text x="1019" y="90" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle" fill="var(--ivory, #F3F2EF)" font-size="13" font-weight="700" letter-spacing="1.4">SHALINICHOUDHARY.IN</text>

  <text x="72" y="156" font-family="Georgia, 'Times New Roman', serif" fill="var(--charcoal, #181818)" font-size="48">Fluent in search &amp; growth. <tspan font-style="italic" fill="var(--terracotta-deep, #8F4F36)">Native to revenue.</tspan></text>
  <text x="72" y="196" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--charcoal, #181818)" font-size="19" font-weight="500">Application pipelines, zero-loss migrations and AI-search visibility across GroupM, Ogilvy, JLL and GUS.</text>

  <!-- Visual: 3-step funnel + proof strip -->
  <g transform="translate(72, 228)">
    <rect x="0" y="0" width="1056" height="252" rx="16" fill="var(--ivory, #F3F2EF)" stroke="var(--stone, #B7B5AF)" stroke-width="1.5"/>
    <text x="32" y="34" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--terracotta-deep, #8F4F36)" font-size="13" font-weight="700" letter-spacing="1.8">ONE-YEAR SEO PAGE FUNNEL · GLOBAL UNIVERSITY SYSTEMS</text>

    <!-- Step 1 -->
    <rect x="32" y="54" width="296" height="124" rx="12" fill="var(--ivory, #F3F2EF)" stroke="var(--charcoal, #181818)" stroke-width="2"/>
    <rect x="32" y="54" width="296" height="6" rx="3" fill="var(--terracotta, #A65F43)"/>
    <text x="54" y="84" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--terracotta-deep, #8F4F36)" font-size="12" font-weight="700" letter-spacing="1.4">01 · LEADS</text>
    <text x="54" y="128" font-family="Georgia, 'Times New Roman', serif" fill="var(--charcoal, #181818)" font-size="42">9,800</text>
    <text x="54" y="156" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--charcoal, #181818)" font-size="15" font-weight="700">SEO-page leads (Salesforce-tracked)</text>

    <line x1="328" y1="116" x2="380" y2="116" stroke="var(--terracotta, #A65F43)" stroke-width="3"/>

    <!-- Step 2 -->
    <rect x="380" y="54" width="296" height="124" rx="12" fill="var(--ivory, #F3F2EF)" stroke="var(--charcoal, #181818)" stroke-width="2"/>
    <rect x="380" y="54" width="296" height="6" rx="3" fill="var(--terracotta, #A65F43)"/>
    <text x="402" y="84" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--terracotta-deep, #8F4F36)" font-size="12" font-weight="700" letter-spacing="1.4">02 · APPLICATIONS</text>
    <text x="402" y="128" font-family="Georgia, 'Times New Roman', serif" fill="var(--charcoal, #181818)" font-size="42">3,200</text>
    <text x="402" y="156" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--charcoal, #181818)" font-size="15" font-weight="700">applications in one year</text>

    <line x1="676" y1="116" x2="728" y2="116" stroke="var(--terracotta, #A65F43)" stroke-width="3"/>

    <!-- Step 3 -->
    <rect x="728" y="54" width="296" height="124" rx="12" fill="var(--charcoal, #181818)"/>
    <text x="750" y="84" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--stone, #B7B5AF)" font-size="12" font-weight="700" letter-spacing="1.4">03 · PIPELINE</text>
    <text x="750" y="128" font-family="Georgia, 'Times New Roman', serif" fill="var(--ivory, #F3F2EF)" font-size="36">INR 416 crore</text>
    <text x="750" y="156" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--stone, #B7B5AF)" font-size="15" font-weight="600">application pipeline</text>

    <!-- Required pipeline label -->
    <rect x="32" y="194" width="992" height="40" rx="8" fill="var(--charcoal, #181818)"/>
    <text x="528" y="219" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle" fill="var(--ivory, #F3F2EF)" font-size="15" font-weight="600">application pipeline, before enrolment conversion, at INR 13 lakh average programme value</text>
  </g>

  <!-- Bottom proof chips -->
  <g transform="translate(72, 504)">
    <rect x="0" y="0" width="246" height="64" rx="12" fill="var(--charcoal, #181818)"/>
    <text x="20" y="39" font-family="Georgia, 'Times New Roman', serif" fill="var(--ivory, #F3F2EF)" font-size="26">+65%</text>
    <text x="96" y="37" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--stone, #B7B5AF)" font-size="13.5" font-weight="600">YoY organic traffic</text>

    <rect x="262" y="0" width="256" height="64" rx="12" fill="var(--charcoal, #181818)"/>
    <text x="284" y="39" font-family="Georgia, 'Times New Roman', serif" fill="var(--ivory, #F3F2EF)" font-size="26">0</text>
    <text x="312" y="37" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--stone, #B7B5AF)" font-size="13.5" font-weight="600">positions lost in migration</text>

    <rect x="534" y="0" width="252" height="64" rx="12" fill="var(--charcoal, #181818)"/>
    <text x="554" y="39" font-family="Georgia, 'Times New Roman', serif" fill="var(--ivory, #F3F2EF)" font-size="26">+15-20%</text>
    <text x="668" y="37" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--stone, #B7B5AF)" font-size="13.5" font-weight="600">AI citation gain</text>

    <rect x="802" y="0" width="254" height="64" rx="12" fill="var(--terracotta-deep, #8F4F36)"/>
    <text x="820" y="39" font-family="Georgia, 'Times New Roman', serif" fill="var(--ivory, #F3F2EF)" font-size="26">+20%</text>
    <text x="894" y="37" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--ivory, #F3F2EF)" font-size="13" font-weight="600">non-branded, 0 budget</text>
  </g>
</svg>
