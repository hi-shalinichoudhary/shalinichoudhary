<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-pipe-title og-pipe-desc">
  <title id="og-pipe-title">Three-step GUS organic search application pipeline funnel</title>
  <desc id="og-pipe-desc">Three-step funnel showing 9,800 SEO-page leads converting into 3,200 applications, forming an INR 416 crore application pipeline, before enrolment conversion, at INR 13 lakh average programme value.</desc>
  <style>
    :root {
      --ivory: #F3F2EF;
      --charcoal: #181818;
      --stone: #B7B5AF;
      --terracotta: #A65F43;
      --terracotta-deep: #8F4F36;
    }
  </style>

  <rect width="1200" height="630" fill="var(--ivory, #F3F2EF)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="var(--ivory, #F3F2EF)" stroke="var(--stone, #B7B5AF)" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="10" rx="5" fill="var(--terracotta, #A65F43)"/>

  <text x="72" y="92" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--terracotta-deep, #8F4F36)" font-size="15" font-weight="700" letter-spacing="2">CASE STUDY · GLOBAL UNIVERSITY SYSTEMS · HIGHER EDUCATION</text>
  <text x="72" y="154" font-family="Georgia, 'Times New Roman', serif" fill="var(--charcoal, #181818)" font-size="46">Turn organic traffic <tspan font-style="italic" fill="var(--terracotta-deep, #8F4F36)">into applications.</tspan></text>

  <!-- 3-step funnel visual -->
  <g transform="translate(72, 196)">
    <rect x="0" y="0" width="1056" height="360" rx="16" fill="var(--ivory, #F3F2EF)" stroke="var(--stone, #B7B5AF)" stroke-width="1.5"/>
    <text x="36" y="42" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--terracotta-deep, #8F4F36)" font-size="14" font-weight="700" letter-spacing="1.8">ONE-YEAR SEO PAGE FUNNEL · GUS (FEB 2022 - SEP 2025)</text>

    <!-- Step 1 -->
    <rect x="36" y="68" width="292" height="196" rx="14" fill="var(--ivory, #F3F2EF)" stroke="var(--charcoal, #181818)" stroke-width="2"/>
    <rect x="36" y="68" width="292" height="8" rx="4" fill="var(--terracotta, #A65F43)"/>
    <text x="62" y="110" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--terracotta-deep, #8F4F36)" font-size="14" font-weight="700" letter-spacing="1.6">01 · LEADS</text>
    <text x="62" y="172" font-family="Georgia, 'Times New Roman', serif" fill="var(--charcoal, #181818)" font-size="54">9,800</text>
    <text x="62" y="210" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--charcoal, #181818)" font-size="20" font-weight="700">SEO-page leads</text>
    <text x="62" y="238" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--terracotta-deep, #8F4F36)" font-size="15" font-weight="600">Salesforce-tracked</text>

    <line x1="328" y1="166" x2="382" y2="166" stroke="var(--terracotta, #A65F43)" stroke-width="3.5"/>

    <!-- Step 2 -->
    <rect x="382" y="82" width="292" height="168" rx="14" fill="var(--ivory, #F3F2EF)" stroke="var(--charcoal, #181818)" stroke-width="2"/>
    <rect x="382" y="82" width="292" height="8" rx="4" fill="var(--terracotta, #A65F43)"/>
    <text x="408" y="122" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--terracotta-deep, #8F4F36)" font-size="14" font-weight="700" letter-spacing="1.6">02 · APPLICATIONS</text>
    <text x="408" y="180" font-family="Georgia, 'Times New Roman', serif" fill="var(--charcoal, #181818)" font-size="54">3,200</text>
    <text x="408" y="218" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--charcoal, #181818)" font-size="20" font-weight="700">applications</text>

    <line x1="674" y1="166" x2="728" y2="166" stroke="var(--terracotta, #A65F43)" stroke-width="3.5"/>

    <!-- Step 3 -->
    <rect x="728" y="94" width="292" height="144" rx="14" fill="var(--charcoal, #181818)"/>
    <text x="752" y="132" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--stone, #B7B5AF)" font-size="14" font-weight="700" letter-spacing="1.6">03 · PIPELINE</text>
    <text x="752" y="180" font-family="Georgia, 'Times New Roman', serif" fill="var(--ivory, #F3F2EF)" font-size="38">INR 416 crore</text>
    <text x="752" y="214" font-family="Helvetica Neue, Arial, sans-serif" fill="var(--stone, #B7B5AF)" font-size="18" font-weight="600">application pipeline</text>

    <!-- Label -->
    <rect x="36" y="288" width="984" height="48" rx="10" fill="var(--charcoal, #181818)"/>
    <text x="528" y="318" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle" fill="var(--ivory, #F3F2EF)" font-size="17" font-weight="600">application pipeline, before enrolment conversion, at INR 13 lakh average programme value</text>
  </g>
</svg>
